<svg class="vz" viewBox="0 0 360 408" role="img" xmlns="http://www.w3.org/2000/svg"><title>从一句需求到上线评审</title><desc>六步：一句需求、研究计划、时点检索、回测、上线闸门、评审单。</desc><style>.vz text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F2340;}.vz .t2{fill:#3D5371;}.vz .t3{fill:#55697F;}.vz .grid{stroke:#DDE3EA;stroke-width:1;}.vz .base{stroke:#A7B4C2;stroke-width:1;}</style><rect x="2" y="2" width="356" height="46" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="16.0" y="25.0" font-size="16" text-anchor="start" dominant-baseline="middle">一句需求</text><text x="344.0" y="25.0" font-size="12" text-anchor="end" dominant-baseline="middle" class="t3">研究员用自己的话提</text><path d="M180.0,51 v14" stroke="#5E7896" stroke-width="1.5"/><path d="M175.0,60 l5,6 l5,-6" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="2" y="70" width="356" height="46" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="16.0" y="93.0" font-size="16" text-anchor="start" dominant-baseline="middle">研究计划</text><text x="344.0" y="93.0" font-size="12" text-anchor="end" dominant-baseline="middle" class="t3">模型拆，代码按字典校验</text><path d="M180.0,119 v14" stroke="#5E7896" stroke-width="1.5"/><path d="M175.0,128 l5,6 l5,-6" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="2" y="138" width="356" height="46" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="16.0" y="161.0" font-size="16" text-anchor="start" dominant-baseline="middle">时点检索</text><text x="344.0" y="161.0" font-size="12" text-anchor="end" dominant-baseline="middle" class="t3">只看当时已入库的研报</text><path d="M180.0,187 v14" stroke="#5E7896" stroke-width="1.5"/><path d="M175.0,196 l5,6 l5,-6" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="2" y="206" width="356" height="46" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="16.0" y="229.0" font-size="16" text-anchor="start" dominant-baseline="middle">回测</text><text x="344.0" y="229.0" font-size="12" text-anchor="end" dominant-baseline="middle" class="t3">固定流程执行</text><path d="M180.0,255 v14" stroke="#5E7896" stroke-width="1.5"/><path d="M175.0,264 l5,6 l5,-6" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="2" y="274" width="356" height="46" rx="3" fill="#0F2340" stroke="#0F2340" stroke-width="1.2"/><text style="fill:#fff" x="16.0" y="297.0" font-size="16" text-anchor="start" dominant-baseline="middle" font-weight="600">上线闸门</text><text x="344.0" y="297.0" font-size="12" text-anchor="end" dominant-baseline="middle" style="fill:#C9D3DD">12 项事先写定的检查</text><path d="M180.0,323 v14" stroke="#5E7896" stroke-width="1.5"/><path d="M175.0,332 l5,6 l5,-6" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="2" y="342" width="356" height="46" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="16.0" y="365.0" font-size="16" text-anchor="start" dominant-baseline="middle">评审单</text><text x="344.0" y="365.0" font-size="12" text-anchor="end" dominant-baseline="middle" class="t3">通过 / 有条件 / 不通过</text></svg>