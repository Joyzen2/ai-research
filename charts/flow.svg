<svg class="vz" viewBox="0 0 1200 150" role="img" xmlns="http://www.w3.org/2000/svg"><title>从一句需求到上线评审</title><desc>六步：一句需求、研究计划、时点检索、回测、上线闸门、评审单。</desc><style>.vz text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F2340;}.vz .t2{fill:#3D5371;}.vz .t3{fill:#55697F;}.vz .grid{stroke:#DDE3EA;stroke-width:1;}.vz .base{stroke:#A7B4C2;stroke-width:1;}</style><rect x="1.0" y="34" width="168" height="56" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="85.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle">一句需求</text><text x="85.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">研究员用自己的话提</text><path d="M175.0,62 h24" stroke="#5E7896" stroke-width="1.5" fill="none"/><path d="M199.0,57 l7,5 l-7,5" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="207.0" y="34" width="168" height="56" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="291.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle">研究计划</text><text x="291.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">模型拆，代码按字典校验</text><path d="M381.0,62 h24" stroke="#5E7896" stroke-width="1.5" fill="none"/><path d="M405.0,57 l7,5 l-7,5" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="413.0" y="34" width="168" height="56" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="497.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle">时点检索</text><text x="497.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">只看当时已入库的研报</text><path d="M587.0,62 h24" stroke="#5E7896" stroke-width="1.5" fill="none"/><path d="M611.0,57 l7,5 l-7,5" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="619.0" y="34" width="168" height="56" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="703.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle">回测</text><text x="703.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">固定流程执行</text><path d="M793.0,62 h24" stroke="#5E7896" stroke-width="1.5" fill="none"/><path d="M817.0,57 l7,5 l-7,5" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="825.0" y="34" width="168" height="56" rx="3" fill="#0F2340" stroke="#0F2340" stroke-width="1.2"/><text style="fill:#fff" x="909.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="600">上线闸门</text><text x="909.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">12 项事先写定的检查</text><path d="M999.0,62 h24" stroke="#5E7896" stroke-width="1.5" fill="none"/><path d="M1023.0,57 l7,5 l-7,5" stroke="#5E7896" stroke-width="1.5" fill="none"/><rect x="1031.0" y="34" width="168" height="56" rx="3" fill="#F4F6F8" stroke="#0F2340" stroke-width="1.2"/><text x="1115.0" y="62.0" font-size="17" text-anchor="middle" dominant-baseline="middle">评审单</text><text x="1115.0" y="114.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" class="t3">通过 / 有条件 / 不通过</text></svg>